<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/style.css">
    <title>SpendWise - Entrar</title>
</head>

<body>
    <section class="auth auth--login">
        <h1 class="auth__title">Entrar</h1>

        <form class="auth__form" id="login-form" method="POST" action="/login">
            <div class="auth__group">
                <label for="login-email" class="auth__label">Email</label>
                <input type="email" id="login-email" name="email" class="auth__input" required>
            </div>

            <div class="auth__group">
                <label for="login-password" class="auth__label">Senha</label>
                <input type="password" id="login-password" name="password" class="auth__input" required>
            </div>

            <button type="submit" class="auth__button">Entrar</button>

            <p class="auth__switch">Não tem uma conta? <a href="#" class="auth__link"
                    id="show-register">Cadastrar-se</a></p>
        </form>
    </section>

    <section class="auth auth--register hidden">
        <h1 class="auth__title">Cadastrar-se</h1>

        <form class="auth__form" id="register-form" method="POST" action="/register">
            <div class="auth__group">
                <label for="register-name" class="auth__label">Nome</label>
                <input type="text" id="register-name" name="name" class="auth__input" required>
            </div>

            <div class="auth__group">
                <label for="register-email" class="auth__label">Email</label>
                <input type="email" id="register-email" name="email" class="auth__input" required>
            </div>

            <div class="auth__group">
                <label for="register-password" class="auth__label">Senha</label>
                <input type="password" id="register-password" name="password" class="auth__input" required>
            </div>

            <div class="auth__group">
                <label for="register-confirm" class="auth__label">Confirmar Senha</label>
                <input type="password" id="register-confirm" name="confirm_password" class="auth__input" required>
            </div>

            <button type="submit" class="auth__button">Cadastrar</button>

            <p class="auth__switch">Já tem uma conta? <a href="#" class="auth__link" id="show-login">Entrar</a></p>
        </form>
    </section>

    <script src="../assets/js/login.js"></script>

</body>

</html>
